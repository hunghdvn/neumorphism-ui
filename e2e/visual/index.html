<!doctype html>
<html lang="en" data-neu-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Visual states</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/tokens/neu.css" />
    <script type="module" src="/elements/cdn/neu.min.js"></script>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      section { padding: 24px; display: grid; gap: 20px; }
      .row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
      .fields { display: grid; grid-template-columns: repeat(3, 240px); gap: 20px; }
      * { caret-color: transparent; }
    </style>
  </head>
  <body>
    <section id="light" class="neu-surface" data-neu-theme="light"></section>
    <section id="dark" data-neu-theme="dark"></section>
    <section
      id="custom"
      class="neu-surface"
      style="--neu-bg: #f5d0d8; --neu-accent: #c2185b"
    ></section>

    <template id="states">
      <div class="row">
        <neu-button>Default</neu-button>
        <neu-button variant="primary">Primary</neu-button>
        <neu-button variant="flat">Flat</neu-button>
        <neu-button disabled>Disabled</neu-button>
        <neu-button loading>Loading</neu-button>
        <neu-button size="sm">Small</neu-button>
        <neu-button size="lg">Large</neu-button>
      </div>
      <div class="row">
        <neu-switch>Off</neu-switch>
        <neu-switch checked>On</neu-switch>
        <neu-switch disabled>Disabled off</neu-switch>
        <neu-switch disabled checked>Disabled on</neu-switch>
        <neu-switch size="sm" checked>Small</neu-switch>
        <neu-switch size="lg" checked>Large</neu-switch>
      </div>
      <div class="fields">
        <neu-text-field label="Empty" placeholder="you@example.com"></neu-text-field>
        <neu-text-field label="Filled" value="hung@example.com"></neu-text-field>
        <neu-text-field label="With help" help-text="We never share it"></neu-text-field>
        <neu-text-field label="Disabled" value="locked" disabled></neu-text-field>
        <neu-text-field
          data-state="invalid"
          label="Invalid"
          type="email"
          required
          error-text="Enter an email"
        ></neu-text-field>
        <neu-text-field label="Small" size="sm" placeholder="sm"></neu-text-field>
      </div>
      <div class="row">
        <neu-icon name="check"></neu-icon>
        <neu-icon name="chevron-down"></neu-icon>
        <neu-icon name="chevron-up"></neu-icon>
        <neu-icon name="plus"></neu-icon>
        <neu-icon name="minus"></neu-icon>
        <neu-icon name="x"></neu-icon>
        <neu-icon name="alert-circle"></neu-icon>
        <neu-icon name="user"></neu-icon>
        <neu-icon name="check" label="Done"></neu-icon>
      </div>
      <div class="row">
        <neu-icon-button icon="plus" label="Add"></neu-icon-button>
        <neu-icon-button icon="check" label="Confirm" variant="primary"></neu-icon-button>
        <neu-icon-button icon="x" label="Close" variant="flat"></neu-icon-button>
        <neu-icon-button icon="plus" label="Add disabled" disabled></neu-icon-button>
        <neu-icon-button icon="plus" label="Add square" shape="square"></neu-icon-button>
        <neu-icon-button icon="plus" label="Add small" size="sm"></neu-icon-button>
        <neu-icon-button icon="plus" label="Add large" size="lg"></neu-icon-button>
      </div>
      <div class="row">
        <neu-button-group label="Actions">
          <neu-button>One</neu-button>
          <neu-button>Two</neu-button>
          <neu-button>Three</neu-button>
        </neu-button-group>
        <neu-button-group label="Stepper" orientation="vertical">
          <neu-icon-button icon="chevron-up" label="Up"></neu-icon-button>
          <neu-icon-button icon="chevron-down" label="Down"></neu-icon-button>
        </neu-button-group>
      </div>
      <div class="row">
        <neu-surface>Raised</neu-surface>
        <neu-surface shape="inset">Inset</neu-surface>
        <neu-surface shape="flat">Flat</neu-surface>
        <neu-surface shape="convex">Convex</neu-surface>
        <neu-surface shape="concave">Concave</neu-surface>
        <neu-surface elevation="sm">Low</neu-surface>
        <neu-surface elevation="md">Mid</neu-surface>
        <neu-surface elevation="lg">High</neu-surface>
        <neu-surface radius="full">Full</neu-surface>
      </div>
      <div class="row">
        <neu-divider style="inline-size: 160px"></neu-divider>
        <span>Before</span>
        <neu-divider orientation="vertical"></neu-divider>
        <span>After</span>
      </div>
      <div class="row">
        <neu-badge>Neutral</neu-badge>
        <neu-badge variant="accent">Accent</neu-badge>
        <neu-badge variant="success">Success</neu-badge>
        <neu-badge variant="warning">Warning</neu-badge>
        <neu-badge variant="danger">Danger</neu-badge>
        <neu-badge pill>Pill</neu-badge>
      </div>
      <div class="row">
        <neu-avatar
          label="Photo"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23c2185b'/%3E%3Ccircle cx='4' cy='4' r='2' fill='%23fff'/%3E%3C/svg%3E"
        ></neu-avatar>
        <neu-avatar label="Hung Do" initials="HD"></neu-avatar>
        <neu-avatar label="Guest"></neu-avatar>
        <neu-avatar label="Rounded" initials="RD" shape="rounded"></neu-avatar>
        <neu-avatar label="Small" initials="SM" size="sm"></neu-avatar>
        <neu-avatar label="Large" initials="LG" size="lg"></neu-avatar>
      </div>
      <div class="row">
        <neu-spinner size="sm"></neu-spinner>
        <neu-spinner></neu-spinner>
        <neu-spinner size="lg"></neu-spinner>
      </div>
    </template>
    <script type="module">
      const states = document.getElementById('states');
      for (const section of document.querySelectorAll('section')) {
        section.append(states.content.cloneNode(true));
      }
    </script>
  </body>
</html>
