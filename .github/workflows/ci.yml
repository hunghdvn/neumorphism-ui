name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The browser jobs run in Playwright's image, which ships the browsers and their system packages.
# Installing them on the runner (`playwright install --with-deps`) stalled for the full job
# timeout three times, on apt downloads from the Ubuntu mirror. Firefox refuses to start as root
# with a HOME it does not own, hence `HOME: /root` on the steps that launch browsers.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm gen --check
      - run: pnpm typecheck
      - run: pnpm test
        env:
          HOME: /root
      - run: pnpm size

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:visual
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/

  ssr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm examples:build
      - run: pnpm docs:build
      - run: pnpm test:docs
        env:
          HOME: /root
      - run: pnpm test:ssr:prod
        env:
          HOME: /root
      - run: pnpm test:ssr:dev
        env:
          HOME: /root
