name: Release
on:
  push:
    branches: [main]
# id-token: npm trusted publishing (OIDC) authenticates the publish and signs provenance,
# so no npm token is stored anywhere. Each package lists this repo and release.yml as its
# trusted publisher on npmjs.com.
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # No registry-url: it would write an .npmrc with a placeholder token in front of OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or newer; pnpm publish hands the tarball to this npm.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
