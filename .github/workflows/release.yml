name: Release
on:
  push:
    branches: [main]
# id-token: npm trusted publishing (OIDC) authenticates the publish and signs provenance,
# so no npm token is stored anywhere. Each package lists this repo and release.yml as its
# trusted publisher on npmjs.com.
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No registry-url: it would write an .npmrc with a placeholder token in front of OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or newer; pnpm publish hands the tarball to this npm.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
